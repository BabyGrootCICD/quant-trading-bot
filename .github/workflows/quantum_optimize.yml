name: Quantum Optimization (Weekly)

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  quantum-optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run quantum optimization
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        run: python -m src.quantum.runner

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: quantum-results
          path: quantum_results.json
          retention-days: 30
